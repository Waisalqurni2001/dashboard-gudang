<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Distribusi Pupuk & Chemical</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: #f5f7fa;
    }

    .hidden {
      display: none !important;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    h1,
    h2 {
      color: #2c3e50;
      margin-bottom: 15px;
    }

    .login-page {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: 350px;
      text-align: center;
    }

    .login-box input {
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .logout {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .grid-5 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .summary-item {
      background: white;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #2ecc71;
    }

    .summary-item h3 {
      font-size: 14px;
      color: #7f8c8d;
    }

    .summary-item p {
      font-size: 24px;
      font-weight: bold;
      color: #2c3e50;
      margin-top: 5px;
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
      align-items: end;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn-primary {
      background: #2ecc71;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-success {
      background: #27ae60;
      color: white;
      border: none;
      cursor: pointer;
    }

    .btn-danger {
      background: #e74c3c;
      color: white;
      border: none;
      cursor: pointer;
      padding: 5px 10px;
      font-size: 12px;
    }

    .btn-warning {
      background: #f39c12;
      color: white;
      border: none;
      cursor: pointer;
      padding: 5px 10px;
      font-size: 12px;
      margin-right: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #f8f9fa;
      color: #2c3e50;
    }

    .status {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }

    .kategori {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }

    .Gudang {
      background: #f39c12;
      color: white;
    }

    .Dikirim {
      background: #3498db;
      color: white;
    }

    .Terkirim {
      background: #27ae60;
      color: white;
    }

    .Pupuk {
      background: #2ecc71;
      color: white;
    }

    .Pestisida {
      background: #e67e22;
      color: white;
    }

    .Herbisida {
      background: #9b59b6;
      color: white;
    }

    .Fungisida {
      background: #1abc9c;
      color: white;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    #chartDistribusi {
      max-height: 300px;
    }
  </style>
</head>

<body>
  <div id="loginPage" class="login-page">
    <div class="login-box">
      <h2>🔐 Login Admin Distribusi</h2>
      <p style="color: #7f8c8d; margin-bottom: 20px; font-size: 14px;">Pupuk & Chemical</p>
      <input type="text" id="username" placeholder="Username" value="admin">
      <input type="password" id="password" placeholder="Password" value="admin123">
      <button onclick="login()">Masuk</button>
      <p id="loginError" style="color: #e74c3c; margin-top: 10px; font-size: 12px;"></p>
    </div>
  </div>

  <div id="dashboard" class="hidden">
    <div class="container">
      <div class="header">
        <h1>🌾 Dashboard Distribusi Pupuk & Chemical</h1>
        <button class="logout" onclick="logout()">Logout</button>
      </div>

      <div class="grid-5">
        <div class="summary-item">
          <h3>Total Item</h3>
          <p id="totalBarang">0</p>
        </div>
        <div class="summary-item" style="border-left-color: #2ecc71;">
          <h3>Stok Pupuk</h3>
          <p id="totalPupuk">0</p>
        </div>
        <div class="summary-item" style="border-left-color: #e67e22;">
          <h3>Stok Chemical</h3>
          <p id="totalChemical">0</p>
        </div>
        <div class="summary-item" style="border-left-color: #e74c3c;">
          <h3>Total Keluar</h3>
          <p id="diKirim">0</p>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <h2 id="formTitle">Input Transaksi Gudang</h2>
          <form id="formBarang">
            <input type="hidden" id="editIndex"> <!-- TARO DISINI -->
            <div>
              <label style="display:block; font-size:13px; color:#7f8c8d; margin-bottom:4px; font-weight:600;">Jenis
                Transaksi</label>
              <select id="jenisTransaksi" required onchange="toggleTujuan()">
                <option value="Diterima">Barang Masuk / Diterima</option>
                <option value="Dikirim">Barang Keluar / Dikirim</option>
              </select>
            </div>
            <div>
              <label
                style="display:block; font-size:13px; color:#7f8c8d; margin-bottom:4px; font-weight:600;">Kategori</label>
              <select id="kategori" required onchange="updateNamaProduk()">
                <option value="">Pilih Kategori</option>
                <option value="Pupuk">Pupuk</option>
                <option value="Pestisida">Pestisida</option>
                <option value="Herbisida">Herbisida</option>
                <option value="Fungisida">Fungisida</option>
              </select>
            </div>
            <div>
              <label style="display:block; font-size:13px; color:#7f8c8d; margin-bottom:4px; font-weight:600;">Nama
                Produk</label>
              <select id="namaBarang" required>
                <option value="">Pilih kategori dulu</option>
              </select>
            </div>
            <div>
              <label style="display:block; font-size:13px; color:#7f8c8d; margin-bottom:4px; font-weight:600;">No.
                Dokumen</label>
              <input type="text" id="noDokumen" placeholder="SJ/001" required>
            </div>
            <div>
              <label
                style="display:block; font-size:13px; color:#7f8c8d; margin-bottom:4px; font-weight:600;">Jumlah</label>
              <input type="number" id="jumlah" placeholder="100" required>
            </div>
            <div>
              <label
                style="display:block; font-size:13px; color:#7f8c8d; margin-bottom:4px; font-weight:600;">Satuan</label>
              <select id="satuan" required>
                <option value="Kg">Kg</option>
                <option value="Liter">Liter</option>
                <option value="Sak">Sak</option>
                <option value="Botol">Botol</option>
                <option value="Jerigen">Jerigen</option>
              </select>
            </div>
            <div>
              <label style="display:block; font-size:13px; color:#7f8c8d; margin-bottom:4px; font-weight:600;">Nama
                Mandor</label>
              <input type="text" id="tujuan" placeholder="Kosongkan kalau Barang Masuk">
            </div>
            <div>
              <label style="display:block; font-size:13px; color:#7f8c8d; margin-bottom:4px; font-weight:600;">Tanggal
                Transaksi</label>
              <input type="date" id="tglKirim" required>
            </div>
            <div style="grid-column: 1 / -1; display:flex; gap:10px;">
              <button type="submit" class="btn-primary" id="btnSubmit" style="flex:1;">+ Simpan Transaksi</button>
              <button type="button" class="btn-warning hidden" id="btnCancel" onclick="cancelEdit()">Batal</button>
            </div>
          </form>
        </div>

        <div class="card">
          <h2>Stok Gudang Saat Ini</h2>
          <div id="tabelStok"></div>
        </div>
    </div>

    <div class="card">
      <h2>Riwayat Mutasi Barang</h2>
      <div class="toolbar">
        <select id="filterKategori">
          <option value="Semua">Semua Kategori</option>
          <option value="Pupuk">Pupuk</option>
          <option value="Pestisida">Pestisida</option>
          <option value="Herbisida">Herbisida</option>
          <option value="Fungisida">Fungisida</option>
        </select>
        <select id="filterStatus">
          <option value="Semua">Semua Transaksi</option>
          <option value="Diterima">Barang Masuk</option>
          <option value="Dikirim">Barang Keluar</option>
        </select>
        <button class="btn-success" onclick="exportExcel()">📊 Export Excel</button>
        <button class="btn-success" onclick="exportPDF()">📄 Export PDF</button>
      </div>
      <table id="tabelBarang">
        <thead>
          <tr>
            <th>No</th>
            <th>Kategori</th>
            <th>Produk</th>
            <th>No. Dokumen</th>
            <th>Jumlah</th>
            <th>Tujuan</th>
            <th>Tanggal</th>
            <th>Jenis</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    let dataTransaksi = JSON.parse(localStorage.getItem('dataTransaksiTani')) || [];

    const tbody = document.querySelector("#tabelBarang tbody");
    const form = document.getElementById("formBarang");
    let chart;

    const listProduk = {
      Pupuk: ["ZA", "NPK", "TSP", "KCL", "UREA"],
      Herbisida: ["Amegras", "Amcomin", "Roundup", "Gramoxone"],
      Pestisida: ["Dursban", "Decis", "Curacron", "Regent"],
      Fungisida: ["Antracol", "Dithane", "Score", "AmistarTop"]
    };

    // Hitung saldo stok gudang per produk
    function hitungSaldo(namaProduk) {
      let masuk = dataTransaksi
        .filter(d => d.nama === namaProduk && d.jenis === 'Diterima')
        .reduce((sum, d) => sum + d.jumlah, 0);

      let keluar = dataTransaksi
        .filter(d => d.nama === namaProduk && d.jenis === 'Dikirim')
        .reduce((sum, d) => sum + d.jumlah, 0);

      return masuk - keluar;
    }

    // Ambil semua produk unik + saldonya
    function getStokGudang() {
      const produkUnik = [...new Set(dataTransaksi.map(d => d.nama))];
      return produkUnik.map(nama => {
        const sample = dataTransaksi.find(d => d.nama === nama);
        return {
          nama: nama,
          kategori: sample.kategori,
          satuan: sample.satuan,
          saldo: hitungSaldo(nama)
        };
      }).filter(p => p.saldo > 0); // Tampilkan yg ada stoknya aja
    }

    function updateNamaProduk() {
      const kategori = document.getElementById('kategori').value;
      const namaBarang = document.getElementById('namaBarang');
      namaBarang.innerHTML = '<option value="">Pilih Produk</option>';
      if (kategori && listProduk[kategori]) {
        listProduk[kategori].forEach(produk => {
          namaBarang.innerHTML += `<option value="${produk}">${produk}</option>`;
        });
      }
    }

    function toggleTujuan() {
      const jenis = document.getElementById('jenisTransaksi').value;
      const tujuan = document.getElementById('tujuan');
      if (jenis === 'Diterima') {
        tujuan.value = 'Gudang';
        tujuan.disabled = true;
        tujuan.placeholder = 'Otomatis: Gudang';
      } else {
        tujuan.value = '';
        tujuan.disabled = false;
        tujuan.placeholder = 'Pak Sutrisno';
        tujuan.required = true;
      }
    }

    function login() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      if (user === 'admin' && pass === 'admin123') {
        localStorage.setItem('isLoggedInTani', 'true');
        showDashboard();
      } else {
        document.getElementById('loginError').innerText = 'Username/password salah!';
      }
    }

    function logout() {
      localStorage.removeItem('isLoggedInTani');
      location.reload();
    }

    function showDashboard() {
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('tglKirim').valueAsDate = new Date();
      renderTabel();
      renderChart();
      renderStok();
    }

    function saveData() {
      localStorage.setItem('dataTransaksiTani', JSON.stringify(dataTransaksi));
    }

    function renderTabel() {
      tbody.innerHTML = "";
      let filterKat = document.getElementById('filterKategori').value;
      let filterJenis = document.getElementById('filterStatus').value;

      let dataFiltered = dataTransaksi.filter(d => {
        return (filterKat === "Semua" || d.kategori === filterKat) &&
          (filterJenis === "Semua" || d.jenis === filterJenis);
      });

      dataFiltered.forEach((item, index) => {
        let realIndex = dataTransaksi.indexOf(item);
        tbody.innerHTML += `
      <tr>
        <td>${index + 1}</td>
        <td><span class="kategori ${item.kategori}">${item.kategori}</span></td>
        <td>${item.nama}</td>
        <td>${item.noDokumen}</td>
        <td>${item.jumlah} ${item.satuan}</td>
        <td>${item.jenis === 'Diterima' ? 'Gudang' : item.tujuan}</td>
        <td>${new Date(item.tanggal).toLocaleDateString('id-ID')}</td>
        <td>
          <button class="status ${item.jenis === 'Diterima' ? 'Terkirim' : 'Dikirim'}"
                  onclick="document.getElementById('filterStatus').value='${item.jenis}'; renderTabel();"
                  style="border:none; cursor:pointer;">
            ${item.jenis}
          </button>
        </td>
        <td>
          <button class="btn-warning" onclick="editData(${realIndex})">Edit</button>
          <button class="btn-danger" onclick="hapusData(${realIndex})">Hapus</button>
        </td>
      </tr>
    `;
      });
      updateSummary();
      renderStok();
    }

    function renderStok() {
      const stok = getStokGudang();
      let html = '<table style="width:100%; font-size:13px;"><thead><tr><th>Produk</th><th>Kategori</th><th>Stok Gudang</th></tr></thead><tbody>';
      stok.forEach(s => {
        const warnaStok = s.saldo < 10 ? 'color:#e74c3c;' : 'color:#27ae60;';
        html += `<tr>
      <td>${s.nama}</td>
      <td><span class="kategori ${s.kategori}">${s.kategori}</span></td>
      <td><b style="${warnaStok}">${s.saldo} ${s.satuan}</b> ${s.saldo < 10 ? '⚠️' : ''}</td>
    </tr>`;
      });
      html += '</tbody></table>';
      document.getElementById('tabelStok').innerHTML = html;
    }

    function updateSummary() {
      document.getElementById("totalBarang").innerText = getStokGudang().length;
      document.getElementById("totalPupuk").innerText = getStokGudang().filter(d => d.kategori === "Pupuk").length;
      document.getElementById("totalChemical").innerText = getStokGudang().filter(d => d.kategori !== "Pupuk").length;
      document.getElementById("diKirim").innerText = dataTransaksi.filter(d => d.jenis === "Dikirim").reduce((sum, d) => sum + d.jumlah, 0);
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const jenis = document.getElementById('jenisTransaksi').value;
      const nama = document.getElementById('namaBarang').value;
      const jumlah = parseInt(document.getElementById('jumlah').value);
      const editIndex = document.getElementById('editIndex').value;

      // Hitung saldo lama dulu kalau mode edit
      let saldoSebelumEdit = hitungSaldo(nama);
      if (editIndex !== '') {
        const dataLama = dataTransaksi[editIndex];
        if (dataLama.nama === nama) {
          // Kalau produk sama, kembalikan stok lama dulu
          if (dataLama.jenis === 'Diterima') saldoSebelumEdit -= dataLama.jumlah;
          if (dataLama.jenis === 'Dikirim') saldoSebelumEdit += dataLama.jumlah;
        }
      }

      // Validasi stok kalau mau kirim
      if (jenis === 'Dikirim') {
        const saldo = editIndex !== '' ? saldoSebelumEdit : hitungSaldo(nama);
        if (jumlah > saldo) {
          alert(`Stok ${nama} di gudang cuma ${saldo}. Gak bisa kirim ${jumlah}!`);
          return;
        }
      }

      const data = {
        kategori: document.getElementById('kategori').value,
        nama: nama,
        noDokumen: document.getElementById('noDokumen').value,
        jumlah: jumlah,
        satuan: document.getElementById('satuan').value,
        tujuan: jenis === 'Dikirim' ? document.getElementById('tujuan').value : 'Gudang',
        jenis: jenis,
        tanggal: document.getElementById('tglKirim').value
      };

      if (editIndex === '') {
        dataTransaksi.push(data);
      } else {
        dataTransaksi[editIndex] = data;
        cancelEdit();
      }

      saveData();
      form.reset();
      document.getElementById('tglKirim').valueAsDate = new Date();
      toggleTujuan();
      renderTabel();
      renderChart();
    });

    function hapusData(index) {
      if (confirm('Yakin hapus transaksi ini? Saldo gudang bakal berubah.')) {
        dataTransaksi.splice(index, 1);
        saveData();
        renderTabel();
        renderChart();
      }
    }

    function editData(index) {
      const item = dataTransaksi[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('jenisTransaksi').value = item.jenis;
      document.getElementById('kategori').value = item.kategori;
      updateNamaProduk();
      toggleTujuan(); // kalau lu pake fungsi toggleTujuan dari sebelumnya
      setTimeout(() => {
        document.getElementById('namaBarang').value = item.nama;
      }, 50);
      document.getElementById('noDokumen').value = item.noDokumen;
      document.getElementById('jumlah').value = item.jumlah;
      document.getElementById('satuan').value = item.satuan;
      document.getElementById('tujuan').value = item.tujuan === 'Gudang' ? '' : item.tujuan;
      document.getElementById('tglKirim').value = item.tanggal;

      document.getElementById('formTitle').innerText = 'Edit Transaksi';
      document.getElementById('btnSubmit').innerText = 'Update Transaksi';
      document.getElementById('btnCancel').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      document.getElementById('editIndex').value = '';
      form.reset();
      document.getElementById('tglKirim').valueAsDate = new Date();
      toggleTujuan(); // reset tujuan field
      document.getElementById('formTitle').innerText = 'Input Transaksi Gudang';
      document.getElementById('btnSubmit').innerText = '+ Simpan Transaksi';
      document.getElementById('btnCancel').classList.add('hidden');
    }

    function renderChart() {
      const ctx = document.getElementById('chartDistribusi');
      const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const dataMasuk = new Array(12).fill(0);
      const dataKeluar = new Array(12).fill(0);

      dataTransaksi.forEach(item => {
        const month = new Date(item.tanggal).getMonth();
        if (item.jenis === 'Diterima') dataMasuk[month] += item.jumlah;
        else dataKeluar[month] += item.jumlah;
      });

      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: bulan,
          datasets: [
            { label: 'Barang Masuk', data: dataMasuk, backgroundColor: '#27ae60' },
            { label: 'Barang Keluar', data: dataKeluar, backgroundColor: '#e74c3c' }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          scales: { y: { title: { display: true, text: 'Jumlah' } } },
          plugins: { title: { display: true, text: 'Mutasi Barang Masuk vs Keluar' } }
        }
      });
    }

    function exportExcel() {
      const ws = XLSX.utils.json_to_sheet(dataTransaksi);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Mutasi Barang");
      XLSX.writeFile(wb, "Mutasi_Gudang.xlsx");
    }

    function exportPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape' });
      doc.text("Laporan Mutasi Gudang", 14, 15);
      doc.autoTable({
        head: [['No', 'Jenis', 'Kategori', 'Produk', 'No.Dok', 'Jumlah', 'Tujuan', 'Tanggal']],
        body: dataTransaksi.map((item, i) => [i + 1, item.jenis, item.kategori, item.nama, item.noDokumen, `${item.jumlah} ${item.satuan}`, item.tujuan, item.tanggal]),
        startY: 20,
        styles: { fontSize: 8 }
      });
      doc.save("Mutasi_Gudang.pdf");
    }

    document.getElementById('filterKategori').addEventListener("change", renderTabel);
    document.getElementById('filterStatus').addEventListener("change", renderTabel);
    if (localStorage.getItem('isLoggedInTani') === 'true') showDashboard();
  </script>
